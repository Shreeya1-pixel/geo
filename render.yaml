# Render blueprint — GeoTrade (free-tier deploy)
#
# Workers (Celery) require a paid plan / payment method on this workspace, so
# this Blueprint deploys API + static frontend + Postgres + Key Value only.
# Background ingestion will not run until workers are added after billing is set up.
#
# Everything has a working keyless default (see .env.example).

services:
  # ── FastAPI backend ─────────────────────────────────────────────────────────
  - type: web
    name: geotrade-api
    runtime: docker
    dockerfilePath: ./infra/docker/Dockerfile
    dockerContext: .
    buildFilter:
      paths:
        - app/**
        - alembic/**
        - requirements.txt
        - infra/docker/Dockerfile
        - start.sh
    dockerCommand: ./start.sh
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: geotrade-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: geotrade-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: geotrade-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: geotrade-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: USER_API_KEY_ENCRYPTION_KEY
        generateValue: true
      - key: FINNHUB_API_KEY
        sync: false
      - key: FINNHUB_API_KEY_2
        sync: false
      - key: TWELVEDATA_API_KEY
        sync: false
      - key: ALPHAVANTAGE_API_KEY
        sync: false
      - key: FRED_API_KEY
        sync: false
      - key: NEWSAPI_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: MARKET_DATA_LIVE_ONLY
        value: "false"

  # ── Frontend (static bundle) ────────────────────────────────────────────────
  - type: web
    name: geotrade-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        value: https://geotrade-api.onrender.com/api/v1

  # ── Redis-compatible Key Value ──────────────────────────────────────────────
  - type: keyvalue
    name: geotrade-redis
    plan: free
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: geotrade-db
    databaseName: geotrade
    user: geotrade
    plan: free
    region: oregon
